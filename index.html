<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#6C63FF" />
              <path
                d="M8 12h8M12 8v8"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span>NexusAI</span>
          </div>
          <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        </div>
        <div class="sidebar-info">
          <p>Chat history is saved locally.</p>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="chat-main">
        <header class="chat-header">
          <span class="header-title">NexusAI Assistant</span>
          <span class="header-badge">Online</span>
        </header>

        <div class="messages-container" id="messagesContainer">
          <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <circle
                  cx="24"
                  cy="24"
                  r="22"
                  fill="#6C63FF22"
                  stroke="#6C63FF"
                  stroke-width="1.5"
                />
                <path
                  d="M16 24h16M24 16v16"
                  stroke="#6C63FF"
                  stroke-width="2.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <h2>How can I help you today?</h2>
            <p>Start a conversation below.</p>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrapper">
            <textarea
              id="userInput"
              placeholder="Message NexusAI..."
              rows="1"
              autocomplete="off"
            ></textarea>
            <button class="send-btn" id="sendBtn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path
                  d="M22 2L11 13"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M22 2L15 22L11 13L2 9L22 2Z"
                  stroke="white"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <p class="input-hint">
            NexusAI can make mistakes. Verify important information.
          </p>
        </div>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
