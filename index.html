<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #ff6500;
        --primary-dark: #e55a00;
        --secondary: #404041;
        --bg: #ffffff;
        --surface: #f7f7f6;
        --surface2: #f0f0ef;
        --border: #e8e8e6;
        --text: #1a1a1a;
        --text-muted: #9a9a98;
        --user-bubble: #ff6500;
        --bot-bubble: #f4f4f3;
        --radius: 18px;
        --header-h: 64px;
        --input-area-h: 80px;
      }

      html,
      body {
        height: 100%;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      /* ── LAYOUT ── */
      .app {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        max-width: 800px;
        margin: 0 auto;
        position: relative;
      }

      /* ── HEADER ── */
      .header {
        height: var(--header-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.25rem;
        border-bottom: 1.5px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
        z-index: 10;
      }
      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-logo {
        width: 34px;
        height: 34px;
        background: var(--primary);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-logo svg {
        display: block;
      }
      .header-title {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--secondary);
        letter-spacing: -0.01em;
      }
      .header-title span {
        color: var(--primary);
      }
      .header-badge {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: #fff3eb;
        color: var(--primary);
        border: 1px solid #ffd4b3;
        border-radius: 6px;
        padding: 2px 7px;
      }
      .clear-btn {
        background: none;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.2s;
      }
      .clear-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      /* ── CHAT AREA ── */
      .chat-area {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        scroll-behavior: smooth;
      }
      .chat-area::-webkit-scrollbar {
        width: 4px;
      }
      .chat-area::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      /* ── WELCOME ── */
      .welcome {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 12px;
        padding: 3rem 1rem;
        animation: fadeUp 0.5s ease both;
      }
      .welcome-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #ff6500, #ff8c42);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(255, 101, 0, 0.25);
      }
      .welcome h2 {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--secondary);
        letter-spacing: -0.02em;
      }
      .welcome p {
        font-size: 0.9rem;
        color: var(--text-muted);
        max-width: 320px;
        line-height: 1.6;
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 8px;
      }
      .suggestion-chip {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.82rem;
        color: var(--secondary);
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
      }
      .suggestion-chip:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: #fff3eb;
      }

      /* ── MESSAGES ── */
      .message {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        animation: fadeUp 0.3s ease both;
        max-width: 100%;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        flex-direction: row-reverse;
      }

      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .avatar.bot {
        background: linear-gradient(135deg, #ff6500, #ff8c42);
        color: #fff;
      }
      .avatar.user {
        background: var(--secondary);
        color: #fff;
      }

      .bubble {
        max-width: min(75%, 520px);
        padding: 0.7rem 1rem;
        border-radius: var(--radius);
        font-size: 0.92rem;
        line-height: 1.65;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .message.user .bubble {
        background: var(--user-bubble);
        color: #fff;
        border-bottom-right-radius: 5px;
      }
      .message.bot .bubble {
        background: var(--bot-bubble);
        color: var(--text);
        border-bottom-left-radius: 5px;
        border: 1px solid var(--border);
      }
      .message.bot.error .bubble {
        background: #fff5f5;
        border-color: #fca5a5;
        color: #c53030;
      }

      /* timestamp */
      .msg-time {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-top: 3px;
        padding: 0 4px;
      }
      .message.user .msg-time {
        text-align: right;
      }

      .msg-wrap {
        display: flex;
        flex-direction: column;
        max-width: min(75%, 520px);
      }
      .message.user .msg-wrap {
        align-items: flex-end;
      }

      /* ── TYPING ── */
      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0.7rem 1rem;
        background: var(--bot-bubble);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        border-bottom-left-radius: 5px;
        width: fit-content;
      }
      .typing-dot {
        width: 7px;
        height: 7px;
        background: var(--text-muted);
        border-radius: 50%;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-5px);
        }
      }

      /* ── INPUT AREA ── */
      .input-area {
        padding: 0.9rem 1.25rem 1rem;
        border-top: 1.5px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
      }
      .input-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: 16px;
        padding: 8px 8px 8px 14px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .input-row:focus-within {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(255, 101, 0, 0.1);
      }
      .chat-input {
        flex: 1;
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--text);
        outline: none;
        resize: none;
        max-height: 120px;
        min-height: 24px;
        line-height: 1.5;
        padding: 3px 0;
      }
      .chat-input::placeholder {
        color: #c4c4c2;
      }
      .send-btn {
        width: 38px;
        height: 38px;
        background: var(--primary);
        border: none;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background 0.2s,
          transform 0.15s,
          opacity 0.2s;
      }
      .send-btn:hover:not(:disabled) {
        background: var(--primary-dark);
        transform: scale(1.05);
      }
      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .input-hint {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 6px;
        text-align: center;
      }

      /* ── MOBILE ── */
      @media (max-width: 480px) {
        .header {
          padding: 0 1rem;
        }
        .chat-area {
          padding: 1rem;
        }
        .input-area {
          padding: 0.75rem 1rem 0.85rem;
        }
        .bubble {
          max-width: 85%;
          font-size: 0.9rem;
        }
        .msg-wrap {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <header class="header">
        <div class="header-brand">
          <div class="header-logo">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M10 2C7 2 4.5 4.5 4.5 7.5c0 1.8.85 3.4 2.17 4.4L5.5 18l3-1.5 1.5 1.5 1.5-1.5 3 1.5-1.17-6.1A5.48 5.48 0 0015.5 7.5C15.5 4.5 13 2 10 2z"
                fill="white"
              />
            </svg>
          </div>
          <span class="header-title">Orbit<span>AI</span></span>
          <span class="header-badge">Beta</span>
        </div>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
      </header>

      <!-- CHAT AREA -->
      <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <svg width="28" height="28" viewBox="0 0 20 20" fill="none">
              <path
                d="M10 2C7 2 4.5 4.5 4.5 7.5c0 1.8.85 3.4 2.17 4.4L5.5 18l3-1.5 1.5 1.5 1.5-1.5 3 1.5-1.17-6.1A5.48 5.48 0 0015.5 7.5C15.5 4.5 13 2 10 2z"
                fill="white"
              />
            </svg>
          </div>
          <h2>Hey, I'm OrbitAI 👋</h2>
          <p>
            Ask me anything — I'm here to help you think, write, and explore
            ideas.
          </p>
          <div class="suggestions">
            <span class="suggestion-chip" onclick="sendSuggestion(this)"
              >✍️ Write a short story</span
            >
            <span class="suggestion-chip" onclick="sendSuggestion(this)"
              >💡 Give me a business idea</span
            >
            <span class="suggestion-chip" onclick="sendSuggestion(this)"
              >🌐 Explain the internet</span
            >
            <span class="suggestion-chip" onclick="sendSuggestion(this)"
              >🧠 What is AI?</span
            >
          </div>
        </div>
      </div>

      <!-- INPUT -->
      <div class="input-area">
        <div class="input-row">
          <textarea
            class="chat-input"
            id="chatInput"
            placeholder="Message OrbitAI…"
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" onclick="handleSend()" disabled>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M2 9h14M9 2l7 7-7 7"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="input-hint">
          Enter to send &nbsp;·&nbsp; Shift+Enter for new line
        </div>
      </div>
    </div>

    <script>
      const WEBHOOK =
        "https://n8n.srv1106977.hstgr.cloud/webhook/c6171376-5a20-4514-8671-2ea679717665";

      const chatArea = document.getElementById("chatArea");
      const input = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const welcome = document.getElementById("welcome");
      let isLoading = false;

      /* ── Auto-resize textarea ── */
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
        sendBtn.disabled = !input.value.trim() || isLoading;
      });

      /* ── Enter to send ── */
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          if (!sendBtn.disabled) handleSend();
        }
      });

      /* ── Suggestion chips ── */
      function sendSuggestion(el) {
        input.value = el.textContent.replace(/^.{2}\s/, "");
        input.dispatchEvent(new Event("input"));
        handleSend();
      }

      /* ── Helpers ── */
      function getTime() {
        return new Date().toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function hideWelcome() {
        if (welcome) welcome.style.display = "none";
      }

      function scrollBottom() {
        chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: "smooth" });
      }

      function appendMessage(text, role, isError = false) {
        const isUser = role === "user";
        const wrap = document.createElement("div");
        wrap.className = `message ${role}${isError ? " error" : ""}`;

        const avatarDiv = document.createElement("div");
        avatarDiv.className = `avatar ${role}`;
        avatarDiv.textContent = isUser ? "U" : "AI";

        const msgWrap = document.createElement("div");
        msgWrap.className = "msg-wrap";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        const time = document.createElement("div");
        time.className = "msg-time";
        time.textContent = getTime();

        msgWrap.appendChild(bubble);
        msgWrap.appendChild(time);

        if (isUser) {
          wrap.appendChild(msgWrap);
          wrap.appendChild(avatarDiv);
        } else {
          wrap.appendChild(avatarDiv);
          wrap.appendChild(msgWrap);
        }

        chatArea.appendChild(wrap);
        scrollBottom();
        return bubble;
      }

      function showTyping() {
        const wrap = document.createElement("div");
        wrap.className = "message bot";
        wrap.id = "typingMsg";

        const avatar = document.createElement("div");
        avatar.className = "avatar bot";
        avatar.textContent = "AI";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement("div");
          dot.className = "typing-dot";
          indicator.appendChild(dot);
        }

        wrap.appendChild(avatar);
        wrap.appendChild(indicator);
        chatArea.appendChild(wrap);
        scrollBottom();
      }

      function removeTyping() {
        const el = document.getElementById("typingMsg");
        if (el) el.remove();
      }

      /* ── Main send ── */
      async function handleSend() {
        const text = input.value.trim();
        if (!text || isLoading) return;

        hideWelcome();
        isLoading = true;
        sendBtn.disabled = true;
        input.value = "";
        input.style.height = "auto";

        appendMessage(text, "user");
        showTyping();

        try {
          const res = await fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: text,
              timestamp: new Date().toISOString(),
            }),
          });

          removeTyping();

          if (!res.ok) throw new Error(`Server responded with ${res.status}`);

          let botReply = "";
          const contentType = res.headers.get("content-type") || "";

          if (contentType.includes("application/json")) {
            const data = await res.json();
            // Try common response fields
            botReply =
              data.output ||
              data.reply ||
              data.message ||
              data.text ||
              data.response ||
              (typeof data === "string" ? data : JSON.stringify(data, null, 2));
          } else {
            botReply = (await res.text()).trim() || "Got it! ✅";
          }

          appendMessage(botReply, "bot");
        } catch (err) {
          removeTyping();
          appendMessage(
            "⚠️ Could not reach the server. Please check your connection and try again.",
            "bot",
            true,
          );
          console.error("Webhook error:", err);
        } finally {
          isLoading = false;
          sendBtn.disabled = !input.value.trim();
          input.focus();
        }
      }

      /* ── Clear chat ── */
      function clearChat() {
        const msgs = chatArea.querySelectorAll(".message");
        msgs.forEach((m) => m.remove());
        if (welcome) welcome.style.display = "flex";
      }

      /* ── Focus input on load ── */
      input.focus();
    </script>
  </body>
</html>
