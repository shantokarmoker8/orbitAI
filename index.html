<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>OrbitAI</title>
<link rel="icon" type="image/png" href="assets/icon.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#ff6500;
  --primary-d:#e05800;
  --secondary:#404041;
  --bg:#ffffff;
  --surface:#f6f6f5;
  --border:#e5e5e3;
  --text:#1a1a1a;
  --muted:#999997;
  --user-bg:#ff6500;
  --bot-bg:#f0f0ef;
  --radius:16px;
}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  height:100%;
  height:100dvh;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.app{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:760px;
  margin:0 auto;
  height:100%;
  height:100dvh;
  overflow:hidden;
  position:relative;
}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  z-index:10;
}
.brand{display:flex;align-items:center;gap:9px}
.logo{
  width:34px;height:34px;
  background:var(--primary);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.logo img{width:22px;height:22px;object-fit:contain;display:block}
.app-name{font-size:1rem;font-weight:700;color:var(--secondary);letter-spacing:-.01em}
.app-name span{color:var(--primary)}
.badge{
  font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  background:#fff3eb;color:var(--primary);
  border:1px solid #ffd0a8;border-radius:5px;padding:2px 6px;
}
.clear-btn{
  background:none;border:1px solid var(--border);border-radius:8px;
  padding:5px 12px;font-size:.78rem;font-weight:500;color:var(--muted);
  cursor:pointer;transition:all .2s;font-family:inherit;
}
.clear-btn:hover{border-color:var(--primary);color:var(--primary)}

/* ── CHAT AREA ── */
.chat{
  flex:1 1 0;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:20px 16px 8px;
  display:flex;
  flex-direction:column;
  gap:12px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── WELCOME ── */
.welcome{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  gap:10px;padding:40px 16px;
  animation:up .4s ease both;
  flex:1;
}
.welcome-icon{
  width:68px;height:68px;
  background:var(--primary);
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:4px;
  overflow:hidden;
}
.welcome-icon img{width:44px;height:44px;object-fit:contain;display:block}
.welcome h2{font-size:1.3rem;font-weight:700;color:var(--secondary);letter-spacing:-.02em}
.welcome p{font-size:.88rem;color:var(--muted);max-width:300px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:4px}
.chip{
  background:var(--surface);border:1px solid var(--border);
  border-radius:20px;padding:6px 13px;
  font-size:.8rem;color:var(--secondary);font-weight:500;
  cursor:pointer;transition:all .18s;font-family:inherit;
}
.chip:hover{border-color:var(--primary);color:var(--primary);background:#fff4ed}

/* ── MESSAGES ── */
.msg{
  display:flex;align-items:flex-end;gap:8px;
  animation:up .25s ease both;
  max-width:100%;
}
.msg.user{flex-direction:row-reverse}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.av{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;flex-shrink:0;
  align-self:flex-end;
  overflow:hidden;
}
.av.bot{background:var(--primary)}
.av.bot img{width:18px;height:18px;object-fit:contain;display:block}
.av.user{background:var(--secondary);color:#fff}

.msg-col{display:flex;flex-direction:column;max-width:min(72%,480px)}
.msg.user .msg-col{align-items:flex-end}

.bubble{
  padding:9px 13px;border-radius:var(--radius);
  font-size:.9rem;line-height:1.65;word-break:break-word;white-space:pre-wrap;
}
.msg.user .bubble{
  background:var(--user-bg);color:#fff;
  border-bottom-right-radius:4px;
}
.msg.bot .bubble{
  background:var(--bot-bg);color:var(--text);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}
.msg.bot.err .bubble{background:#fff5f5;border-color:#fca5a5;color:#b91c1c}

.ts{font-size:.65rem;color:var(--muted);margin-top:3px;padding:0 3px}

/* ── TYPING ── */
.typing{
  display:flex;align-items:center;gap:4px;
  padding:10px 13px;background:var(--bot-bg);
  border:1px solid var(--border);border-radius:var(--radius);
  border-bottom-left-radius:4px;width:fit-content;
}
.dot{
  width:6px;height:6px;background:var(--muted);border-radius:50%;
  animation:bop 1.1s infinite ease-in-out;
}
.dot:nth-child(2){animation-delay:.18s}
.dot:nth-child(3){animation-delay:.36s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── INPUT AREA ── */
.input-wrap{
  flex-shrink:0;
  padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--border);
  background:var(--bg);
  z-index:10;
}
.input-box{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:14px;
  padding:7px 7px 7px 13px;
  transition:border-color .2s,box-shadow .2s;
}
.input-box:focus-within{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(255,101,0,.10);
}
textarea#inp{
  flex:1;border:none;background:transparent;
  font-family:inherit;font-size:.92rem;color:var(--text);
  outline:none;resize:none;
  max-height:110px;min-height:22px;
  line-height:1.5;padding:3px 0;
  -webkit-appearance:none;
}
textarea#inp::placeholder{color:#c0c0be}
.send{
  width:36px;height:36px;flex-shrink:0;
  background:var(--primary);border:none;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s,transform .15s,opacity .2s;
}
.send:hover:not(:disabled){background:var(--primary-d);transform:scale(1.06)}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:.68rem;color:var(--muted);text-align:center;margin-top:5px}

.spin{
  display:none;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .65s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.send.loading .spin{display:block}
.send.loading .arrow{display:none}

@media(max-width:480px){
  .header{padding:0 12px}
  .chat{padding:14px 12px 6px}
  .input-wrap{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .msg-col{max-width:82%}
  .bubble{font-size:.88rem}
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo">
        <img src="assets/icon.png" alt="OrbitAI logo"/>
      </div>
      <span class="app-name">Orbit<span>AI</span></span>
      <span class="badge">Beta</span>
    </div>
    <button class="clear-btn" onclick="clearChat()">Clear</button>
  </header>

  <!-- CHAT -->
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">
        <img src="assets/icon.png" alt="OrbitAI"/>
      </div>
      <h2>Hey, I'm OrbitAI 👋</h2>
      <p>Ask me anything — I'm here to help you think, write, and explore ideas.</p>
      <div class="chips">
        <button class="chip" onclick="useSuggestion(this)">Write a short story</button>
        <button class="chip" onclick="useSuggestion(this)">Give me a business idea</button>
        <button class="chip" onclick="useSuggestion(this)">Explain the internet</button>
        <button class="chip" onclick="useSuggestion(this)">What is AI?</button>
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-wrap">
    <div class="input-box">
      <textarea id="inp" rows="1" placeholder="Message OrbitAI…"></textarea>
      <button class="send" id="sendBtn" disabled onclick="doSend()">
        <div class="spin"></div>
        <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M8.5 3.5L13 8l-4.5 4.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
  </div>

</div>
<script>
const WEBHOOK='https://n8n.srv1106977.hstgr.cloud/webhook/c6171376-5a20-4514-8671-2ea679717665';
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
const btn=document.getElementById('sendBtn');
let busy=false;

function now(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}

function resize(){
  inp.style.height='auto';
  inp.style.height=Math.min(inp.scrollHeight,110)+'px';
  btn.disabled=!inp.value.trim()||busy;
}
inp.addEventListener('input',resize);
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!btn.disabled)doSend()}
});

function scrollDown(){
  requestAnimationFrame(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}));
}

function hideWelcome(){
  const w=document.getElementById('welcome');
  if(w)w.remove();
}

function addMsg(text,role,isErr=false){
  const wrap=document.createElement('div');
  wrap.className='msg '+role+(isErr?' err':'');

  const av=document.createElement('div');
  av.className='av '+role;
  if(role==='bot'){
    const img=document.createElement('img');
    img.src='assets/icon.png';
    img.alt='AI';
    av.appendChild(img);
  } else {
    av.textContent='U';
  }

  const col=document.createElement('div');
  col.className='msg-col';
  const bub=document.createElement('div');
  bub.className='bubble';
  bub.textContent=text;
  const ts=document.createElement('div');
  ts.className='ts';
  ts.textContent=now();
  col.appendChild(bub);
  col.appendChild(ts);

  if(role==='user'){wrap.appendChild(col);wrap.appendChild(av)}
  else{wrap.appendChild(av);wrap.appendChild(col)}
  chat.appendChild(wrap);
  scrollDown();
}

function showTyping(){
  const w=document.createElement('div');
  w.className='msg bot';w.id='typing';
  const av=document.createElement('div');
  av.className='av bot';
  const img=document.createElement('img');
  img.src='assets/icon.png';img.alt='AI';
  av.appendChild(img);
  const t=document.createElement('div');
  t.className='typing';
  for(let i=0;i<3;i++){const d=document.createElement('div');d.className='dot';t.appendChild(d)}
  w.appendChild(av);w.appendChild(t);
  chat.appendChild(w);
  scrollDown();
}
function removeTyping(){const el=document.getElementById('typing');if(el)el.remove()}

function useSuggestion(el){inp.value=el.textContent;resize();doSend()}

async function doSend(){
  const text=inp.value.trim();
  if(!text||busy)return;
  hideWelcome();
  busy=true;btn.disabled=true;btn.classList.add('loading');
  inp.value='';inp.style.height='auto';
  addMsg(text,'user');
  showTyping();
  try{
    const r=await fetch(WEBHOOK,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,timestamp:new Date().toISOString()})
    });
    removeTyping();
    if(!r.ok)throw new Error('HTTP '+r.status);
    let reply='';
    const ct=r.headers.get('content-type')||'';
    if(ct.includes('application/json')){
      const d=await r.json();
      reply=d.output||d.reply||d.message||d.text||d.response||(typeof d==='string'?d:JSON.stringify(d,null,2));
    }else{
      reply=(await r.text()).trim()||'Done!';
    }
    addMsg(reply,'bot');
  }catch(e){
    removeTyping();
    addMsg('Could not reach the server. Check your connection and try again.','bot',true);
  }finally{
    busy=false;btn.classList.remove('loading');
    btn.disabled=!inp.value.trim();
    inp.focus();
  }
}

function clearChat(){
  chat.innerHTML='';
  const w=document.createElement('div');
  w.className='welcome';w.id='welcome';
  w.innerHTML=`
    <div class="welcome-icon">
      <img src="assets/icon.png" alt="OrbitAI"/>
    </div>
    <h2>Hey, I'm OrbitAI 👋</h2>
    <p>Ask me anything — I'm here to help you think, write, and explore ideas.</p>
    <div class="chips">
      <button class="chip" onclick="useSuggestion(this)">Write a short story</button>
      <button class="chip" onclick="useSuggestion(this)">Give me a business idea</button>
      <button class="chip" onclick="useSuggestion(this)">Explain the internet</button>
      <button class="chip" onclick="useSuggestion(this)">What is AI?</button>
    </div>`;
  chat.appendChild(w);
}

inp.focus();
</script>
</body>
</html>
